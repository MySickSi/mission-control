<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control - Security & AI News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent: #06b6d4;
            --accent-light: #22d3ee;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --neutral-400: #9ca3af;
            --neutral-600: #4b5563;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a2a4a 100%);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent);
        }

        .header h1 {
            font-size: 2rem;
            color: var(--accent-light);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
        }

        button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .last-updated {
            font-size: 0.9rem;
            color: var(--neutral-400);
        }

        .category-filters {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 2px solid var(--neutral-600);
            color: var(--neutral-400);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .category-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .category-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        .date-section {
            margin-bottom: 2.5rem;
        }

        .date-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .date-header:hover {
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }

        .date-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent);
            border-radius: 4px;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .date-header.collapsed .date-toggle {
            transform: rotate(-90deg);
        }

        .date-label {
            flex: 1;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-light);
        }

        .date-count {
            padding: 0.25rem 0.75rem;
            background: rgba(6, 182, 212, 0.2);
            color: var(--accent);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .articles-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            max-height: none;
            overflow: visible;
            transition: all 0.3s ease;
        }

        .articles-container.hidden {
            display: none;
        }

        .article-card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            cursor: pointer;
        }

        .article-card:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.15);
            transform: translateY(-4px);
        }

        .article-card a {
            color: inherit;
            text-decoration: none;
        }

        .article-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            background: rgba(6, 182, 212, 0.2);
            color: var(--accent-light);
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
        }

        .article-badge.critical {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .article-badge.high {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
        }

        .article-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-light);
            line-height: 1.4;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--neutral-400);
        }

        .article-source {
            opacity: 0.7;
        }

        .article-time {
            opacity: 0.6;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--neutral-400);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--accent);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-light);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--neutral-400);
            margin-top: 0.5rem;
        }

        .refresh-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-radius: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🔐 Security & AI News</h1>
                <p class="last-updated" style="margin-top: 0.5rem;">Last updated: <span id="last-update">Loading...</span></p>
            </div>
            <div class="header-controls">
                <button onclick="refreshNews()">↻ Refresh Now</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-articles">0</div>
                <div class="stat-label">Total Articles</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="critical-count">0</div>
                <div class="stat-label">Critical Alerts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="recent-count">0</div>
                <div class="stat-label">Added Today</div>
            </div>
        </div>

        <div class="category-filters" id="category-filters"></div>

        <div id="news-container">
            <div class="loading">
                <div class="loading-spinner"></div>
                Loading news...
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = [
            'All',
            'AI Security',
            'Data Breach',
            'Vulnerability',
            'Policy/Regulation',
            'Threat Alert'
        ];

        let allArticles = [];
        let selectedCategory = 'All';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryFilters();
            loadNews();
        });

        function renderCategoryFilters() {
            const container = document.getElementById('category-filters');
            container.innerHTML = CATEGORIES.map(cat => `
                <button class="category-btn ${cat === 'All' ? 'active' : ''}" onclick="filterByCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');
        }

        function filterByCategory(category) {
            selectedCategory = category;
            
            // Update button states
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim() === category);
            });
            
            renderArticles();
        }

        async function loadNews() {
            try {
                const response = await fetch('/api/news');
                const data = await response.json();
                allArticles = data.articles || [];
                
                updateStats();
                renderArticles();
                updateLastFetch(data.lastUpdated);
            } catch (err) {
                console.error('Error loading news:', err);
                document.getElementById('news-container').innerHTML = `
                    <div class="empty-state">
                        <p>Failed to load news. Check console for details.</p>
                    </div>
                `;
            }
        }

        function groupArticlesByDate(articles) {
            const groups = {};
            
            articles.forEach(article => {
                const date = new Date(article.fetchedAt);
                const dateStr = date.toLocaleDateString('en-US', { 
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                if (!groups[dateStr]) {
                    groups[dateStr] = [];
                }
                groups[dateStr].push(article);
            });
            
            // Sort dates descending (today first)
            const sorted = {};
            Object.keys(groups)
                .sort((a, b) => new Date(b) - new Date(a))
                .forEach(key => {
                    sorted[key] = groups[key];
                });
            
            return sorted;
        }

        function renderArticles() {
            const filtered = selectedCategory === 'All'
                ? allArticles
                : allArticles.filter(a => a.category === selectedCategory);

            if (filtered.length === 0) {
                document.getElementById('news-container').innerHTML = `
                    <div class="empty-state">
                        <p>No articles in this category yet.</p>
                    </div>
                `;
                return;
            }

            const grouped = groupArticlesByDate(filtered);
            const today = new Date().toLocaleDateString('en-US', { 
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            const html = Object.entries(grouped).map(([dateStr, articles], index) => {
                const isToday = dateStr === today;
                const dateId = `date-${dateStr.replace(/\s+/g, '-')}`;
                
                return `
                    <div class="date-section">
                        <div class="date-header ${!isToday ? 'collapsed' : ''}" onclick="toggleDate('${dateId}')">
                            <div class="date-toggle">▼</div>
                            <div class="date-label">${dateStr}</div>
                            <div class="date-count">${articles.length}</div>
                        </div>
                        <div class="articles-container ${!isToday ? 'hidden' : ''}" id="${dateId}">
                            ${articles.map(article => {
                                const time = new Date(article.fetchedAt);
                                const timeAgo = getTimeAgo(time);
                                const priorityClass = article.priority ? article.priority.toLowerCase() : '';
                                
                                return `
                                    <a href="${article.url}" target="_blank" rel="noopener noreferrer">
                                        <div class="article-card">
                                            <div style="display: flex; gap: 0.75rem;">
                                                <span class="article-badge ${priorityClass}">
                                                    ${article.category || 'News'}
                                                </span>
                                                ${article.priority === 'critical' ? '<span class="article-badge critical">CRITICAL</span>' : ''}
                                            </div>
                                            <div class="article-title">${escapeHtml(article.title)}</div>
                                            <div class="article-meta">
                                                <span class="article-source">${article.source}</span>
                                                <span class="article-time">${timeAgo}</span>
                                            </div>
                                        </div>
                                    </a>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('news-container').innerHTML = html;
        }

        function toggleDate(dateId) {
            const container = document.getElementById(dateId);
            const header = container.previousElementSibling;
            
            container.classList.toggle('hidden');
            header.classList.toggle('collapsed');
        }

        function updateStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const todayArticles = allArticles.filter(a => new Date(a.fetchedAt) >= today);
            const criticalArticles = allArticles.filter(a => a.priority === 'critical');

            document.getElementById('total-articles').textContent = allArticles.length;
            document.getElementById('critical-count').textContent = criticalArticles.length;
            document.getElementById('recent-count').textContent = todayArticles.length;
        }

        function updateLastFetch(timestamp) {
            if (!timestamp) {
                document.getElementById('last-update').textContent = 'Never';
                return;
            }
            
            const date = new Date(timestamp);
            document.getElementById('last-update').textContent = getTimeAgo(date);
        }

        function getTimeAgo(date) {
            const now = new Date();
            const diff = now - date;
            
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (days > 0) return `${days}d ago`;
            if (hours > 0) return `${hours}h ago`;
            if (minutes > 0) return `${minutes}m ago`;
            return 'Just now';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function refreshNews() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '↻ Fetching...';
            
            try {
                await fetch('/api/news/refresh', { method: 'POST' });
                await loadNews();
            } catch (err) {
                console.error('Refresh failed:', err);
            } finally {
                btn.disabled = false;
                btn.textContent = '↻ Refresh Now';
            }
        }

        // Auto-refresh every 5 minutes
        setInterval(loadNews, 5 * 60 * 1000);
    </script>
</body>
</html>
