<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Justinian Chat</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    header{padding:1rem 1.5rem;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:.75rem;background:#0b1220;flex-shrink:0}
    header h1{font-size:1.1rem;font-weight:600}
    .status{margin-left:auto;font-size:.8rem;color:#10b981}
    #messages{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
    .msg{max-width:80%;padding:.75rem 1rem;border-radius:12px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:.95rem}
    .user{align-self:flex-end;background:#06b6d4;color:#0f172a}
    .bot{align-self:flex-start;background:#1e293b;color:#e2e8f0;border:1px solid #334155}
    .err{align-self:flex-start;background:#7f1d1d;color:#fecaca}
    .typing{align-self:flex-start;color:#94a3b8;font-style:italic}
    .composer{display:flex;gap:.5rem;padding:1rem;border-top:1px solid #1e293b;background:#0b1220;flex-shrink:0}
    textarea{flex:1;padding:.75rem;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;resize:none;font-family:inherit;font-size:.95rem;min-height:44px;max-height:200px}
    textarea:focus{outline:none;border-color:#06b6d4}
    button{padding:0 1.5rem;background:#06b6d4;color:#0f172a;border:none;border-radius:8px;cursor:pointer;font-weight:600}
    button:disabled{opacity:.5;cursor:wait}
    .clear-btn{margin-left:.5rem;background:transparent;color:#94a3b8;font-size:.8rem;padding:.25rem .6rem;border:1px solid #334155;border-radius:6px}
    .clear-btn:hover{color:#06b6d4;border-color:#06b6d4}
    .session{font-size:.7rem;color:#64748b;font-family:monospace}
  </style>
</head>
<body>
  <header>
    <span style="font-size:1.3rem">⚙️</span>
    <h1>Justinian</h1>
    <span style="color:#94a3b8;font-size:.85rem">— OpenClaw Chat</span>
    <span class="session" id="sid"></span>
    <button class="clear-btn" id="newBtn">New Session</button>
    <span class="status" id="status">● Ready</span>
  </header>
  <div id="messages"></div>
  <div class="composer">
    <textarea id="input" placeholder="Message Justinian... (Shift+Enter for newline)" rows="1"></textarea>
    <button type="button" id="send">Send</button>
  </div>
  <script>
  (function(){
    var msgs=document.getElementById('messages');
    var input=document.getElementById('input');
    var sendBtn=document.getElementById('send');
    var newBtn=document.getElementById('newBtn');
    var statusEl=document.getElementById('status');
    var sidEl=document.getElementById('sid');

    var sessionId=localStorage.getItem('justinian-session');
    if(!sessionId){sessionId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());localStorage.setItem('justinian-session',sessionId);}
    sidEl.textContent='sid: '+sessionId.slice(0,8);

    function add(text,cls){
      var d=document.createElement('div');
      d.className='msg '+cls;
      d.textContent=text;
      msgs.appendChild(d);
      msgs.scrollTop=msgs.scrollHeight;
      return d;
    }
    function saveHist(text,cls){
      var k='justinian-history-'+sessionId;
      var h;
      try{h=JSON.parse(localStorage.getItem(k)||'[]');}catch(e){h=[];}
      h.push({text:text,cls:cls});
      if(h.length>100)h.shift();
      localStorage.setItem(k,JSON.stringify(h));
    }
    // restore
    var hist;
    try{hist=JSON.parse(localStorage.getItem('justinian-history-'+sessionId)||'[]');}catch(e){hist=[];}
    if(hist.length===0){add('Hello! I am Justinian. How can I help?','bot');}
    else{hist.forEach(function(m){add(m.text,m.cls);});}

    function newSession(){
      sessionId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());
      localStorage.setItem('justinian-session',sessionId);
      sidEl.textContent='sid: '+sessionId.slice(0,8);
      msgs.innerHTML='';
      add('New session started.','bot');
    }
    newBtn.addEventListener('click',newSession);

    async function send(){
      var message=input.value.trim();
      if(!message)return;
      add(message,'user');saveHist(message,'user');
      input.value='';input.style.height='auto';
      sendBtn.disabled=true;
      statusEl.textContent='● Thinking...';statusEl.style.color='#f59e0b';
      var typing=add('Justinian is thinking...','typing');
      try{
        var resp=await fetch('/api/chat',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({message:message,sessionId:sessionId})
        });
        var data=await resp.json();
        typing.remove();
        if(data.error){add('Error: '+data.error,'err');}
        else{
          add(data.reply||'(empty reply)','bot');
          saveHist(data.reply||'(empty reply)','bot');
          if(data.sessionId&&data.sessionId!==sessionId){
            sessionId=data.sessionId;
            localStorage.setItem('justinian-session',sessionId);
            sidEl.textContent='sid: '+sessionId.slice(0,8);
          }
        }
      }catch(err){
        typing.remove();
        add('Network error: '+err.message,'err');
      }finally{
        sendBtn.disabled=false;
        statusEl.textContent='● Ready';statusEl.style.color='#10b981';
        input.focus();
      }
    }

    sendBtn.addEventListener('click',send);
    input.addEventListener('keydown',function(e){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
    });
    input.addEventListener('input',function(){
      input.style.height='auto';
      input.style.height=Math.min(input.scrollHeight,200)+'px';
    });
    input.focus();
  })();
  </script>
</body>
</html>
